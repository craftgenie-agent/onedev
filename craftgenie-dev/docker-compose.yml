# CraftGenie local development dependencies for OneDev.
#
# PostgreSQL replaces the bundled HSQLDB so local development runs on the same
# engine as production. HSQLDB is configured with sql.ignore_case=true, which makes
# string comparison case-insensitive; PostgreSQL is case-sensitive. Testing on
# HSQLDB therefore hides a whole class of query and uniqueness bugs.
#
# OneDev itself is NOT in this file. It runs on the host via ../dev.sh so that
# hot class reloading keeps working. Use ../cg-dev.sh to drive both together.

name: craftgenie-onedev-dev

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: craftgenie-onedev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onedev}
      POSTGRES_USER: ${POSTGRES_USER:-onedev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      # OneDev's PostgreSQLDialect maps BLOB to bytea and compares strings case-sensitively.
      # C collation keeps ordering stable and predictable across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 6432 by default: 5432 is usually taken by a host PostgreSQL install.
      - "${POSTGRES_PORT:-6432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Both -U and -d matter: pg_isready reports ready on the bootstrap database
      # before the init scripts have created ours.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onedev} -d ${POSTGRES_DB:-onedev}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    command:
      - postgres
      # Louder logging than the default, because this is a machine a developer is
      # debugging on rather than one serving traffic.
      - -c
      - log_statement=ddl
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=200

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: craftgenie-onedev-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@craftgenie.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required - copy .env.example to .env}
      # Desktop mode: no login page, no master password. This is a local dev
      # database on a developer's own machine, and a sign-in wall on it buys
      # nothing. Do not carry these two lines to any shared deployment.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      # pgAdmin validates the login address and rejects reserved TLDs, so a plain
      # .local address fails startup with "does not appear to be a valid email
      # address". Allowing it is more honest than inventing a domain we do not own.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: '["local"]'
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "${PGADMIN_PORT:-6680}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Both generated by cg-dev.sh from .env so the credentials have exactly one
      # source of truth. Neither is committed.
      - ./.runtime/servers.json:/pgadmin4/servers.json:ro
      - ./.runtime/pgpass:/pgpass.src:ro
    # The connection password has to reach pgAdmin as a pgpass file with 0600
    # permissions owned by the pgadmin user, and a bind mount cannot guarantee
    # either. Copy it into the user's storage directory at start instead.
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        storage="/var/lib/pgadmin/storage/$$(echo "$$PGADMIN_DEFAULT_EMAIL" | tr '@' '_')"
        mkdir -p "$$storage"
        cp -f /pgpass.src "$$storage/pgpass"
        chmod 600 "$$storage/pgpass"
        chown -R pgadmin:root /var/lib/pgadmin
        exec /entrypoint.sh

volumes:
  postgres-data:
    name: craftgenie-onedev-postgres-data
  pgadmin-data:
    name: craftgenie-onedev-pgadmin-data
